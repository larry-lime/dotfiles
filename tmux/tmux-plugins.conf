# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'kristijanhusak/tmux-simple-git-status'
set -g @plugin 'rickstaa/tmux-notify'
# Keep last: continuum autosaves via status-right, which later plugins can clobber
set -g @plugin 'tmux-plugins/tmux-continuum'

# Ressurect plugin
set -g @resurrect-capture-pane-contents 'on'
# Resume Claude Code sessions in their panes (ids tagged by Claude hooks)
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-claude-resurrect save'
set -g @resurrect-hook-post-restore-all '~/.local/bin/tmux-claude-resurrect restore'

# Continuum: autosave every 15 min (restore stays manual: prefix + Ctrl-r)
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
