# Set Default Shell
set-option -g default-shell /bin/zsh

set -g set-clipboard off
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -b"

# Enable mouse support
set -g mouse on

# Disable Status Bar
# set -g status off

# Change windows base index
set -g base-index 1

# Ensure window index numbers get reordered on delete
set-option -g renumber-windows on

# Allow programs to rename windows/panes
set-option -g allow-rename off

# Automatically rename windows to match pane title every 1 seconds
set-option -g status-interval 1
set-option -g automatic-rename on
# Name windows after the Claude Code session in them (follows /rename)
# Claude sets its pane title to "<glyph> <session title>"; strip the glyph.
# Falls back to the active pane's command when the window has no Claude pane.
set-option -g automatic-rename-format '#{=/40/…:#{?#{P:#{?#{m/r:^[^[:alnum:][:space:]]+ ,#{pane_title}},x,}},#{P:#{?#{m/r:^[^[:alnum:][:space:]]+ ,#{pane_title}},#{s/ [(]Branch[)]$//:#{s/^[^ ]+ //:pane_title}},}},#{pane_current_command}}}'
# set-option -g automatic-rename-format '#(~/.dotfiles/.local/bin/tmux-window-name "#{pane_current_path}" "#{pane_title}")'

# Stop tmux from detaching when I close a session
set-option -g detach-on-destroy off

# Change terminal colors - This is not necessary in iterm2
# set -s default-terminal "xterm-256color"
#set -as terminal-overrides ",*:Tc"
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

# Pass clickable OSC 8 hyperlinks through to the terminal (tmux 3.4+)
set -as terminal-features ',*:hyperlinks'

# Change escape time
set -s escape-time 0

# Image Rendering
set -gq allow-passthrough on
set -g visual-activity on

# I'm not sure what this does
set-window-option -g xterm-keys on

# Lines
# set -g history-limit 999999999
