# unbind C-b
set-option -g prefix C-f
set-option -g status on
bind-key C-f send-prefix


# Rezize panes without prefix
bind -n C-M-Left resize-pane -L +2
bind -n C-M-Right resize-pane -R +2
bind -n C-M-Up resize-pane -U +2
bind -n C-M-Down resize-pane -D +2

# Switch panes Alt-arrow without prefix
bind -n C-M-h select-pane -L
bind -n C-M-l select-pane -R
bind -n C-M-k select-pane -U
bind -n C-M-j select-pane -D

# Swap windows with CMD+Left/Right
bind Left swap-window -t -1\; select-window -t -1
bind Right swap-window -t +1\; select-window -t +1

# Create a new session
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind k confirm kill-session
bind K confirm kill-server

# Run command
bind T run-shell "tnav" # CMD+t
bind F run-shell "tnav --tmux" # CMD+k
bind J run-shell "$HOME/.local/bin/claude-jump" # jump to a finished Claude session

unbind R
bind P run-shell "$HOME/.local/bin/switch_theme"
bind G display-popup -E -d '#{pane_current_path}' -h 100% -w 100% 'lazygit'
bind W display-popup -E -d '#{pane_current_path}' -h 100% -w 100% 'wt'
bind D display-popup -E -d '#{pane_current_path}' -h 100% -w 100% 'lazydocker'

# Custom layout: terminal (left) | AI agent (right), 50/50, agent pane zoomed
bind E display-menu -T "Select AI Layout" \
  "Claude" c "set-option @ai_tool 'Claude' \; select-pane -T \"Terminal\" \; split-window -h -p 50 -c '#{pane_current_path}' 'claude --continue || claude' \; select-pane -T \"Claude\" \; resize-pane -Z" \
  "Codex" o "set-option @ai_tool 'Codex' \; select-pane -T \"Terminal\" \; split-window -h -p 50 -c '#{pane_current_path}' 'codex resume --last' \; select-pane -T \"Codex\" \; resize-pane -Z" \
  "Gemini" g "set-option @ai_tool 'Gemini' \; select-pane -T \"Terminal\" \; split-window -h -p 50 -c '#{pane_current_path}' gemini \; select-pane -T \"Gemini\" \; resize-pane -Z" \
  "Opencode" p "set-option @ai_tool 'Opencode' \; select-pane -T \"Terminal\" \; split-window -h -p 50 -c '#{pane_current_path}' opencode \; select-pane -T \"Opencode\" \; resize-pane -Z"

# Workspace agent: fresh Claude in ~ (jumps back to it if already running)
bind a new-session -A -s "🤖 Workspace Agent" -c "$HOME" "claude"

# Henry terminal: Claude in ~/HenryLabs (jumps back to it if already running)
bind t new-session -A -s "💻 Henry Terminal" -c "$HOME/HenryLabs" "claude"

# Session priority: prefix the session name with an emoji
bind p display-menu -T "Session Priority" \
  "🟢 Low" l "run-shell \"$HOME/.config/tmux/scripts/session-prio.sh '#{session_id}' 🟢\"" \
  "🟡 Medium" m "run-shell \"$HOME/.config/tmux/scripts/session-prio.sh '#{session_id}' 🟡\"" \
  "🔴 High" h "run-shell \"$HOME/.config/tmux/scripts/session-prio.sh '#{session_id}' 🔴\"" \
  "🚨 Urgent" u "run-shell \"$HOME/.config/tmux/scripts/session-prio.sh '#{session_id}' 🚨\"" \
  "" \
  "Clear" c "run-shell \"$HOME/.config/tmux/scripts/session-prio.sh '#{session_id}'\""

# Split panes using | and -
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Open a new window
bind c new-window -c '#{pane_current_path}'

# Choose a new session
bind C-b run "if [ '#{status}' = 'on' ]; then tmux set-option -g status off; else tmux set-option -g status on; fi"

# Kill window/pane without confirmation
unbind &
bind & kill-window

unbind x
bind x kill-pane

unbind '"'
unbind %
unbind '"'
unbind %
